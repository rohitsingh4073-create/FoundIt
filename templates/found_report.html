<!DOCTYPE html>
<html lang="en">
    <head>
        <title>REPORT A FOUND ITEM</title>
    </head>
    <body>
        <h1>REPORT A FOUND ITEM</h1>
        <form>
            <label for="item_title">Item Name</label>
            <input type="text" id="item_title">
            <br><br>

            <label for="item_description">Item Description</label>
            <input type="text" id="item_description">
            <br><br>

            <label for="item_category">Category</label>
            <input type="text" id="item_category">
            <br><br>

            <label for="found_location">Location where it was found</label>
            <input type="text" id="found_location">
            <br><br>

            <label for="found_date">Date that it was found</label>
            <input type="text" id="found_date">
            <br><br>

            <button type="submit">Submit Found Claim</button>
        </form>
    </body>
</html>
